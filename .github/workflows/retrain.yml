name: Retrain Model on Data Update

on:
  push:
    branches:
      - main
    paths:
      - 'data/**'
      - 'train.py'

  workflow_dispatch:  # Manual trigger option

jobs:
  retrain:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Configure Git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
    
    - name: Retrain model
      run: |
        echo "🔄 Starting model retraining..."
        python train.py  # Your training script
        echo "✅ Model retraining complete"
    
    - name: Commit new models
      run: |
        git add models/*.pkl
        git diff --staged --quiet || git commit -m "🤖 Auto-retrain: Update models [skip ci]"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Trigger deployment
      run: |
        curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}